# Production overlay. Keep docker-compose.yml as the shared service definition.
# Set all secrets and identity URLs in the production .env before starting.
services:
  sbase:
    image: ${SBASE_IMAGE:?Set SBASE_IMAGE to a pinned production image}
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: production,docker
      JAVA_TOOL_OPTIONS: -Xms1g -Xmx3g
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Set JWT_ISSUER_URI for production}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?Set JWT_JWK_SET_URI for production}
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  spark-master:
    restart: unless-stopped
  spark-worker:
    restart: unless-stopped
  doris-fe:
    restart: unless-stopped
  doris-be:
    restart: unless-stopped
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
