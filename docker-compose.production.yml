# Production overlay. Start with:
# docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
# Keep the Docker host firewall and the reverse proxy on the host network secured.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g

  sbase:
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Set JWT_ISSUER_URI}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?Set JWT_JWK_SET_URI}
      DORIS_USERNAME: ${DORIS_USERNAME:?Set DORIS_USERNAME}
      DORIS_PASSWORD: ${DORIS_PASSWORD:?Set DORIS_PASSWORD}
    ports:
      - "${SBASE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s

  spark-master:
    ports: !reset []
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g

  spark-worker:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 4.0

  doris-fe:
    ports: !reset []
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g

  doris-be:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    cpus: 8.0


  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sbase-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - prometheus_scrape_token
    expose:
      - "9090"
    networks: [sbase-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

volumes:
  prometheus-data:

secrets:
  prometheus_scrape_token:
    file: ./secrets/prometheus_scrape_token.txt
