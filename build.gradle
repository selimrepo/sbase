plugins {
    id 'scala'
    id 'application'
}

group = 'io.sbase'
version = '0.1.0-SNAPSHOT'

ext {
    scalaBinaryVersion = '2.13'
    scalaVersion = '2.13.16'
    pekkoVersion = '1.1.3'
    pekkoHttpVersion = '1.1.0'
    sparkVersion = '4.0.1'
    flinkVersion = '2.1.0'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

dependencies {
    implementation "org.scala-lang:scala-library:${scalaVersion}"
    implementation "org.apache.pekko:pekko-actor-typed_${scalaBinaryVersion}:${pekkoVersion}"
    implementation "org.apache.pekko:pekko-cluster-typed_${scalaBinaryVersion}:${pekkoVersion}"
    implementation "org.apache.pekko:pekko-cluster-sharding-typed_${scalaBinaryVersion}:${pekkoVersion}"
    implementation "org.apache.pekko:pekko-http_${scalaBinaryVersion}:${pekkoHttpVersion}"
    implementation "org.apache.pekko:pekko-http-spray-json_${scalaBinaryVersion}:${pekkoHttpVersion}"
    implementation "com.typesafe:config:1.4.3"

    implementation "com.zaxxer:HikariCP:6.2.1"
    implementation "org.postgresql:postgresql:42.7.7"
    implementation "org.flywaydb:flyway-core:11.8.2"
    implementation "org.flywaydb:flyway-database-postgresql:11.8.2"

    implementation "org.apache.spark:spark-sql_${scalaBinaryVersion}:${sparkVersion}"
    compileOnly "org.apache.spark:spark-mllib_${scalaBinaryVersion}:${sparkVersion}"
    implementation "org.apache.mahout:mahout-math:0.13.0"
    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    implementation "com.datastax.oss:java-driver-core:4.17.0"
    implementation "org.apache.solr:solr-solrj:9.8.1"
    compileOnly "org.apache.geode:geode-core:1.15.2"

    implementation "ch.qos.logback:logback-classic:1.5.18"
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.testcontainers:junit-jupiter:1.21.3"
    testImplementation "org.testcontainers:postgresql:1.21.3"
    testImplementation "org.apache.pekko:pekko-actor-testkit-typed_${scalaBinaryVersion}:${pekkoVersion}"
    testImplementation "org.apache.pekko:pekko-http-testkit_${scalaBinaryVersion}:${pekkoHttpVersion}"
}

application {
    mainClass = 'io.sbase.server.Main'
    applicationDefaultJvmArgs = ['-XX:+UseG1GC', '-Dfile.encoding=UTF-8']
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ['-deprecation', '-feature', '-unchecked']
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging { events 'failed', 'skipped' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
