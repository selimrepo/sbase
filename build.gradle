plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sbase'
version = '0.1.0-SNAPSHOT'
description = 'Spring Boot data science and data mining hub'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

ext {
    sparkVersion = '3.5.6'
    mahoutVersion = '14.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation "org.apache.spark:spark-sql_2.12:${sparkVersion}"
    implementation "org.apache.spark:spark-mllib_2.12:${sparkVersion}"
    implementation "org.apache.mahout:mahout-math:${mahoutVersion}"

    runtimeOnly 'org.apache.doris:doris-jdbc:1.4.2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '1g'
}

bootRun {
    jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED',
               '--add-opens=java.base/java.nio=ALL-UNNAMED',
               '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED']
}
