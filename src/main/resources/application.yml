server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: sbase
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbase}
    username: ${SPRING_DATASOURCE_USERNAME:sbase}
    password: ${SPRING_DATASOURCE_PASSWORD:sbase}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SBASE_DB_POOL_MAX:15}
      minimum-idle: ${SBASE_DB_POOL_MIN:2}
      connection-timeout: ${SBASE_DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: 5000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/sbase}
          # Avoid OIDC discovery during application startup; the JWK endpoint is contacted only when validating a token.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/sbase/protocol/openid-connect/certs}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
sbase:
  spark:
    master: ${SPARK_MASTER:local[*]}
    app-name: sbase-data-mining-hub
    shuffle-partitions: 8
  doris:
    pool:
      maximum-pool-size: ${DORIS_POOL_MAX:12}
      minimum-idle: ${DORIS_POOL_MIN:2}
      connection-timeout: ${DORIS_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DORIS_POOL_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${DORIS_POOL_MAX_LIFETIME_MS:1800000}
    jdbc-url: ${DORIS_JDBC_URL:jdbc:mysql://localhost:9030/analytics?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DORIS_USERNAME:root}
    password: ${DORIS_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    database: ${DORIS_DATABASE:analytics}
    allowed-tables: ${DORIS_ALLOWED_TABLES:}
  execution:
    core-threads: ${SBASE_EXECUTOR_CORE_THREADS:4}
    max-threads: ${SBASE_EXECUTOR_MAX_THREADS:8}
    queue-capacity: ${SBASE_EXECUTOR_QUEUE_CAPACITY:100}
    keep-alive-seconds: ${SBASE_EXECUTOR_KEEP_ALIVE_SECONDS:60}
  jobs:
    max-concurrent: 2
    retention-hours: 168
  scheduler:
    poll-ms: ${SBASE_SCHEDULER_POLL_MS:5000}
  pipeline:
    retry:
      max-attempts: ${SBASE_PIPELINE_MAX_ATTEMPTS:4}
      poll-ms: ${SBASE_PIPELINE_RETRY_POLL_MS:5000}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:sbase-artifacts}
