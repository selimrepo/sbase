server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: sbase
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

sbase:
  spark:
    master: ${SPARK_MASTER:local[*]}
    app-name: sbase-data-mining-hub
    shuffle-partitions: 8
  doris:
    jdbc-url: ${DORIS_JDBC_URL:jdbc:mysql://localhost:9030/analytics?useSSL=false}
    username: ${DORIS_USERNAME:root}
    password: ${DORIS_PASSWORD:}
    driver-class-name: org.apache.doris.jdbc.Driver
  jobs:
    max-concurrent: 2
    retention-hours: 168
