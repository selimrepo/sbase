server:
  port: 8080
  shutdown: graceful
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  application:
    name: sbase
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbase}
    username: ${SPRING_DATASOURCE_USERNAME:sbase}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/sbase}
          # Avoid OIDC discovery during application startup; the JWK endpoint is contacted only when validating a token.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/sbase/protocol/openid-connect/certs}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
sbase:
  spark:
    master: ${SPARK_MASTER:local[*]}
    app-name: sbase-data-mining-hub
    shuffle-partitions: 8
  postgres:
    jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbase}
    username: ${SPRING_DATASOURCE_USERNAME:sbase}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    database: ${SBASE_ANALYTICS_SCHEMA:public}
    allowed-tables: ${SBASE_ANALYTICS_ALLOWED_TABLES:}
  jobs:
    max-concurrent: 2
    retention-hours: 168
  scheduler:
    poll-ms: ${SBASE_SCHEDULER_POLL_MS:5000}
  pipeline:
    retry:
      max-attempts: ${SBASE_PIPELINE_MAX_ATTEMPTS:4}
      poll-ms: ${SBASE_PIPELINE_RETRY_POLL_MS:5000}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:sbase-artifacts}

  ml:
    allowed-tables: ${SBASE_ML_ALLOWED_TABLES:}
    artifact-root: ${SBASE_ML_ARTIFACT_ROOT:./data/ml-artifacts}
  bi:
    max-concurrent-queries: ${SBASE_BI_MAX_CONCURRENT:4}
    cache-ttl-ms: ${SBASE_BI_CACHE_TTL_MS:30000}
    max-rows: ${SBASE_BI_MAX_ROWS:5000}
    max-estimated-cost: ${SBASE_BI_MAX_COST:100000}
    artifact-root: ${SBASE_BI_ARTIFACT_ROOT:./data/bi-reports}
    scheduler:
      poll-ms: ${SBASE_BI_SCHEDULER_POLL_MS:15000}
