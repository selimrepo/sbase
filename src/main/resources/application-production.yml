server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/css,text/html,text/javascript,application/javascript
    min-response-size: 1024
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  application:
    name: sbase
  lifecycle:
    timeout-per-shutdown-phase: 45s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SBASE_DB_POOL_MAX:20}
      minimum-idle: ${SBASE_DB_POOL_MIN:4}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        generate_statistics: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: sbase
      environment: production
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

sbase:
  ml:
    allowed-tables: ${SBASE_ML_ALLOWED_TABLES:}
    artifact-root: ${SBASE_ML_ARTIFACT_ROOT:/var/lib/sbase/ml-artifacts}
  bi:
    max-concurrent-queries: ${SBASE_BI_MAX_CONCURRENT:4}
    cache-ttl-ms: ${SBASE_BI_CACHE_TTL_MS:30000}
    max-rows: ${SBASE_BI_MAX_ROWS:5000}
    max-estimated-cost: ${SBASE_BI_MAX_COST:100000}
    artifact-root: ${SBASE_BI_ARTIFACT_ROOT:/var/lib/sbase/bi-reports}
    scheduler:
      poll-ms: ${SBASE_BI_SCHEDULER_POLL_MS:15000}