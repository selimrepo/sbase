server:
  port: 8080
  tomcat:
    threads:
      max: ${SBASE_HTTP_MAX_THREADS:200}
      min-spare: ${SBASE_HTTP_MIN_SPARE_THREADS:20}
    max-connections: ${SBASE_HTTP_MAX_CONNECTIONS:8192}
    accept-count: ${SBASE_HTTP_ACCEPT_COUNT:200}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/css,text/html,text/javascript,application/javascript
    min-response-size: 1024
spring:
  application:
    name: sbase
  lifecycle:
    timeout-per-shutdown-phase: 45s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SBASE_DB_POOL_MAX:20}
      minimum-idle: ${SBASE_DB_POOL_MIN:4}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      leak-detection-threshold: ${SBASE_DB_LEAK_DETECTION_MS:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        generate_statistics: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: sbase
      environment: production
sbase:
  execution:
    core-threads: ${SBASE_EXECUTOR_CORE_THREADS:4}
    max-threads: ${SBASE_EXECUTOR_MAX_THREADS:8}
    queue-capacity: ${SBASE_EXECUTOR_QUEUE_CAPACITY:100}
    keep-alive-seconds: ${SBASE_EXECUTOR_KEEP_ALIVE_SECONDS:60}
  doris:
    pool:
      maximum-pool-size: ${DORIS_POOL_MAX:12}
      minimum-idle: ${DORIS_POOL_MIN:2}
      connection-timeout: ${DORIS_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DORIS_POOL_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${DORIS_POOL_MAX_LIFETIME_MS:1800000}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
