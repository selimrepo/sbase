pekko {
 actor.provider = cluster
 actor.serialization-bindings {
  "org.apache.pekko.serialization.jackson.JacksonJsonSerializable" = jackson-json
 }
 remote.artery { canonical.hostname = "127.0.0.1"; canonical.port = 25520 }
 cluster {
  seed-nodes = ["pekko://sbase@127.0.0.1:25520"]
  downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  split-brain-resolver.active-strategy = keep-majority
 }
}
