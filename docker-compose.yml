services:
  postgres:
    image: postgres:16-alpine
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    mem_limit: 2g


    container_name: sbase-postgres
    environment:
      POSTGRES_DB: sbase
      POSTGRES_USER: sbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting SBase}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbase -d sbase"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sbase-net]
    restart: unless-stopped

  sbase:
    build:
      context: .
      dockerfile: Dockerfile
    image: sbase:latest
    container_name: sbase
    ports:
      - "${SBASE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    expose:
      - "7078"
      - "7079"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sbase
      SPRING_DATASOURCE_USERNAME: sbase
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting SBase}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8081/realms/sbase}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://localhost:8081/realms/sbase/protocol/openid-connect/certs}
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: sbase
      SPARK_EXTRA_JARS: /opt/spark-jars/postgresql.jar
      SBASE_ML_ALLOWED_TABLES: ${SBASE_ML_ALLOWED_TABLES:-}
      SBASE_ML_ARTIFACT_ROOT: /var/lib/sbase/ml-artifacts
      SBASE_BI_ARTIFACT_ROOT: /var/lib/sbase/bi-reports
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sbase-artifacts}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    volumes:
      - sbase-ml-artifacts:/var/lib/sbase/ml-artifacts
      - sbase-bi-reports:/var/lib/sbase/bi-reports
    networks: [sbase-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s

  spark-master:
    image: apache/spark:3.5.6
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g


    container_name: sbase-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    networks: [sbase-net]
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.6
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 4.0


    container_name: sbase-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    networks: [sbase-net]
    restart: unless-stopped


  sbase-node-2:
    profiles: ["app-ha"]
    build:
      context: .
      dockerfile: Dockerfile
    image: sbase:latest
    container_name: sbase-node-2
    ports:
      - "127.0.0.1:8082:8080"
    expose:
      - "7078"
      - "7079"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sbase
      SPRING_DATASOURCE_USERNAME: sbase
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting SBase}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8081/realms/sbase}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://localhost:8081/realms/sbase/protocol/openid-connect/certs}
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: sbase-node-2
      SPARK_EXTRA_JARS: /opt/spark-jars/mysql-connector.jar,/opt/spark-jars/postgresql.jar
      SBASE_ML_ALLOWED_TABLES: ${SBASE_ML_ALLOWED_TABLES:-}
      SBASE_ML_ARTIFACT_ROOT: /var/lib/sbase/ml-artifacts
      SBASE_BI_ARTIFACT_ROOT: /var/lib/sbase/bi-reports
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    
  kafka-1:
    profiles: ["kafka"]
    image: apache/kafka:3.8.1
    hostname: kafka-1
    environment: &kafka-env
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes: [kafka-1-data:/var/lib/kafka/data]
    networks: [sbase-net]
    restart: unless-stopped

  kafka-2:
    profiles: ["kafka"]
    image: apache/kafka:3.8.1
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes: [kafka-2-data:/var/lib/kafka/data]
    networks: [sbase-net]
    restart: unless-stopped

  kafka-3:
    profiles: ["kafka"]
    image: apache/kafka:3.8.1
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes: [kafka-3-data:/var/lib/kafka/data]
    networks: [sbase-net]
    restart: unless-stopped

  schema-registry:
    profiles: ["kafka"]
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: schema-registry
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    expose: ["8081"]
    networks: [sbase-net]
    restart: unless-stopped
  minio:
    profiles: ["object-storage"]
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sbase-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes: [minio-data:/data]
    expose: ["9000","9001"]
    networks: [sbase-net]
    restart: unless-stopped

  minio-init:
    profiles: ["object-storage"]
    image: minio/mc:RELEASE.2025-02-08T19-14-34Z
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sbase-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 3; done
        mc mb --ignore-existing local/sbase-artifacts
        mc version enable local/sbase-artifacts
        mc ilm rule add --expire-days 365 local/sbase-artifacts
        mc ilm rule add --noncurrent-expire-days 90 local/sbase-artifacts
    networks: [sbase-net]
    restart: "no"
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    container_name: sbase-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - prometheus_scrape_token
    expose:
      - "9090"
    networks: [sbase-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g


networks:
  sbase-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  sbase-ml-artifacts:
  sbase-bi-reports:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  minio-data:
  prometheus-data:

secrets:
  prometheus_scrape_token:
    file: ${PROMETHEUS_SCRAPE_TOKEN_FILE:-./secrets/prometheus_scrape_token.txt.example}
