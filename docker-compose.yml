services:
  postgres:
    image: postgres:16-alpine
    container_name: sbase-postgres
    environment:
      POSTGRES_DB: sbase
      POSTGRES_USER: sbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbase}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbase -d sbase"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sbase-net]
    restart: unless-stopped

  sbase:
    build:
      context: .
      dockerfile: Dockerfile
    image: sbase:latest
    container_name: sbase
    ports:
      - "8080:8080"
    expose:
      - "7078"
      - "7079"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sbase
      SPRING_DATASOURCE_USERNAME: sbase
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sbase}
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: sbase
      SPARK_EXTRA_JARS: /opt/spark-jars/mysql-connector.jar,/opt/spark-jars/hadoop-aws.jar,/opt/spark-jars/aws-java-sdk-bundle.jar
      DORIS_JDBC_URL: jdbc:mysql://doris-fe:9030/analytics?useSSL=false&allowPublicKeyRetrieval=true
      DORIS_USERNAME: ${DORIS_USERNAME:-root}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_healthy
      doris-init:
        condition: service_completed_successfully
    networks: [sbase-net]
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.6
    container_name: sbase-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "7077:7077"
      - "8081:8080"
    networks: [sbase-net]
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.6
    container_name: sbase-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    networks: [sbase-net]
    restart: unless-stopped

  doris-fe:
    image: apache/doris:doris-fe-2.1.7
    container_name: sbase-doris-fe
    hostname: doris-fe
    environment:
      FE_SERVERS: fe1:172.30.0.10:9010
      FE_ID: 1
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      sbase-net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9030'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  doris-init:
    image: mysql:8.4
    container_name: sbase-doris-init
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mysql --protocol=TCP -h doris-fe -P 9030 -uroot -e "SELECT 1" >/dev/null 2>&1; do
          echo "Waiting for Doris SQL endpoint..."
          sleep 5
        done

        # A running BE process is not necessarily registered with the FE.
        # Register it explicitly and wait until the FE reports it as alive.
        if ! mysql --protocol=TCP -h doris-fe -P 9030 -uroot -N -e "SHOW BACKENDS" | grep -Fq "172.30.0.11"; then
          mysql --protocol=TCP -h doris-fe -P 9030 -uroot -e "ALTER SYSTEM ADD BACKEND '172.30.0.11:9050'"
        fi

        attempt=0
        until mysql --protocol=TCP -h doris-fe -P 9030 -uroot -N -e "SHOW BACKENDS" | awk '$2 == "172.30.0.11" && tolower($7) == "true" { found=1 } END { exit !found }'; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 60 ]; then
            echo "Doris BE did not become alive in the FE within 5 minutes."
            mysql --protocol=TCP -h doris-fe -P 9030 -uroot -e "SHOW BACKENDS"
            exit 1
          fi
          echo "Waiting for Doris BE registration ($attempt/60)..."
          sleep 5
        done

        mysql --protocol=TCP -h doris-fe -P 9030 -uroot -e "CREATE DATABASE IF NOT EXISTS analytics"
    networks: [sbase-net]
    restart: "no"

  doris-be:
    image: apache/doris:doris-be-2.1.7
    container_name: sbase-doris-be
    hostname: doris-be
    environment:
      FE_SERVERS: fe1:172.30.0.10:9010
      BE_ADDR: 172.30.0.11:9050
    depends_on:
      doris-fe:
        condition: service_healthy
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      sbase-net:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9050'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

networks:
  sbase-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
