# Second application instance sharing PostgreSQL and durable queues.
# It has an independent JVM/process and host port for node-loss/restart tests.
services:
  sbase-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: sbase:latest
    container_name: sbase-node-2
    ports:
      - "8082:8080"
    expose:
      - "7078"
      - "7079"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sbase
      SPRING_DATASOURCE_USERNAME: sbase
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sbase}
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: sbase-node-2
      SPARK_EXTRA_JARS: /opt/spark-jars/mysql-connector.jar,/opt/spark-jars/postgresql.jar
      DORIS_JDBC_URL: jdbc:mysql:loadbalance://doris-fe:9030,doris-fe-2:9030,doris-fe-3:9030/analytics?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=15000&retriesAllDown=3&loadBalanceBlacklistTimeout=15000&loadBalanceHostRemovalGracePeriod=15000
      DORIS_USERNAME: ${DORIS_USERNAME:-root}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_healthy
      doris-init:
        condition: service_completed_successfully
      doris-fe-2:
        condition: service_healthy
      doris-fe-3:
        condition: service_healthy
    networks: [sbase-net]
    restart: unless-stopped
