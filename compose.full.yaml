# Full local platform profile.
# Start with:
# docker compose -f compose.yaml -f compose.full.yaml --profile full up --build -d
#
# Tune *_MEMORY / *_CORES values in .env for the host. Values below are
# deliberately conservative defaults, not hard caps on the host machine.

services:
  app:
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: app
      SPARK_DRIVER_BIND_ADDRESS: 0.0.0.0
      SPARK_DRIVER_PORT: "7078"
      SPARK_BLOCKMANAGER_PORT: "7079"
      FLINK_REST_URL: http://flink-jobmanager:8081
      SBASE_JWT_SECRET: ${SBASE_JWT_SECRET:-dev-only-sbase-jwt-secret-change-me-please}
      SBASE_ICEBERG_ENABLED: "true"
      SBASE_ICEBERG_WAREHOUSE: ${SBASE_ICEBERG_WAREHOUSE:-s3://sbase-warehouse/}
      SBASE_ICEBERG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sbase}
      SBASE_ICEBERG_JDBC_USER: ${POSTGRES_USER:-sbase}
      SBASE_ICEBERG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE_ACCESS: "true"
      SBASE_DB_POOL_SIZE: ${SBASE_DB_POOL_SIZE:-32}
      SBASE_AUTOML_WORKERS: ${SBASE_AUTOML_WORKERS:-4}
      SBASE_AUTOML_QUEUE_CAPACITY: ${SBASE_AUTOML_QUEUE_CAPACITY:-128}
      SBASE_FEDERATED_SCAN_PARALLELISM: ${SBASE_FEDERATED_SCAN_PARALLELISM:-16}
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseG1GC
        -XX:InitialRAMPercentage=${SBASE_JVM_INITIAL_RAM_PERCENTAGE:-25}
        -XX:MaxRAMPercentage=${SBASE_JVM_MAX_RAM_PERCENTAGE:-70}
        -Dfile.encoding=UTF-8
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      solr:
        condition: service_started
      spark-master:
        condition: service_started
      kafka:
    image: apache/kafka:3.9.1
    profiles: ["full"]
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: ${KAFKA_MEMORY_LIMIT:-768m}
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.9.1
    profiles: ["full"]
    hostname: kafka-2
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: ${KAFKA_MEMORY_LIMIT:-768m}
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.9.1
    profiles: ["full"]
    hostname: kafka-3
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: ${KAFKA_MEMORY_LIMIT:-768m}
    restart: unless-stopped

  flink-jobmanager:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    restart: unless-stopped

  cassandra:
    profiles: ["full"]
    environment:
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-2G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-512M}
    mem_limit: ${CASSANDRA_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 30s
      timeout: 15s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  solr:
    profiles: ["full"]
    command: ["solr", "-f"]
    environment:
      SOLR_JAVA_MEM: ${SOLR_JAVA_MEM:--Xms1g -Xmx2g}
      SOLR_HEAP: ${SOLR_HEAP:-2g}
    mem_limit: ${SOLR_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8983/solr/admin/info/system >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  spark-master:
    profiles: ["full"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8081"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8081"
    mem_limit: ${SPARK_MASTER_MEMORY_LIMIT:-2g}
    restart: unless-stopped

  spark-worker:
    profiles: ["full"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - ${SPARK_WORKER_CORES:-4}
      - --memory
      - ${SPARK_WORKER_MEMORY:-8g}
      - spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_LOCAL_DIRS: /tmp
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-8g}
    mem_limit: ${SPARK_WORKER_MEMORY_LIMIT:-10g}
    depends_on:
      - spark-master
    restart: unless-stopped

  flink-jobmanager:
    image: sbase-flink:1.20.2
    build: ./flink
    profiles: ["full"]
    command: ["jobmanager"]
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: ${FLINK_JOBMANAGER_MEMORY:-1600m}
        rest.address: flink-jobmanager
      SBASE_ICEBERG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sbase}
      SBASE_ICEBERG_JDBC_USER: ${POSTGRES_USER:-sbase}
      SBASE_ICEBERG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SBASE_ICEBERG_WAREHOUSE: ${SBASE_ICEBERG_WAREHOUSE:-s3://sbase-warehouse/}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE_ACCESS: "true"
      SBASE_FLINK_CHECKPOINT_INTERVAL_MS: ${SBASE_FLINK_CHECKPOINT_INTERVAL_MS:-30000}
      SBASE_FLINK_CHECKPOINT_TIMEOUT_MS: ${SBASE_FLINK_CHECKPOINT_TIMEOUT_MS:-120000}
    mem_limit: ${FLINK_JOBMANAGER_MEMORY_LIMIT:-2g}
    restart: unless-stopped


  # S3-compatible object storage for Iceberg table data and metadata files.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["full"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
        until mc ready local; do sleep 2; done &&
        mc mb --ignore-existing local/sbase-warehouse &&
        mc version enable local/sbase-warehouse
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  flink-taskmanager:
    image: sbase-flink:1.20.2
    build: ./flink
    profiles: ["full"]
    command: ["taskmanager"]
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        taskmanager.memory.process.size: ${FLINK_TASKMANAGER_MEMORY:-4g}
      SBASE_ICEBERG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sbase}
      SBASE_ICEBERG_JDBC_USER: ${POSTGRES_USER:-sbase}
      SBASE_ICEBERG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SBASE_ICEBERG_WAREHOUSE: ${SBASE_ICEBERG_WAREHOUSE:-s3://sbase-warehouse/}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE_ACCESS: "true"
      SBASE_FLINK_CHECKPOINT_INTERVAL_MS: ${SBASE_FLINK_CHECKPOINT_INTERVAL_MS:-30000}
      SBASE_FLINK_CHECKPOINT_TIMEOUT_MS: ${SBASE_FLINK_CHECKPOINT_TIMEOUT_MS:-120000}
    mem_limit: ${FLINK_TASKMANAGER_MEMORY_LIMIT:-5g}
    depends_on:
      - flink-jobmanager
    restart: unless-stopped

# Persist engine state and Spark spill across restarts. The application model
# registry, PostgreSQL, Cassandra, Solr and Spark scratch volumes are declared
# by compose.yaml and reused by this overlay.

volumes:
  minio_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
