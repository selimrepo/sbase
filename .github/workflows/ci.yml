name: CI

on:
  push:
    branches: [main, develop, feature/catalog-federation-automl-api]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sbase
          POSTGRES_USER: sbase
          POSTGRES_PASSWORD: sbase-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbase -d sbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SBASE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/sbase
      SBASE_TEST_POSTGRES_USER: sbase
      SBASE_TEST_POSTGRES_PASSWORD: sbase-test
      SBASE_POSTGRES_URL: jdbc:postgresql://localhost:5432/sbase
      SBASE_POSTGRES_USER: sbase
      SBASE_POSTGRES_PASSWORD: sbase-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile, unit test, PostgreSQL integration test and package
        run: gradle --no-daemon clean test installDist shadowJar

  workflow-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React Workflow Studio
        run: npm run build

  python-test-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile platform test runner
        run: python -m py_compile scripts/platform_test.py
      - name: Run platform test runner self-tests
        run: python scripts/platform_test.py --self-test
      - name: Validate CLI help
        run: python scripts/platform_test.py --help

  container:
    runs-on: ubuntu-latest
    needs: [backend, workflow-studio, python-test-tool]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate full platform Compose configuration
        run: docker compose -f compose.yaml -f compose.full.yaml --profile full config --quiet
      - name: Build and start every platform service
        run: docker compose -f compose.yaml -f compose.full.yaml --profile full up --build -d
      - name: Wait for API, Studio, PostgreSQL and all engines
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            shift
            if ! "$@"; then
              echo "Not ready: $name"
              return 1
            fi
          }
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null \
              && curl --fail --silent http://localhost:3000/ >/dev/null \
              && docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T postgres pg_isready -U sbase -d sbase >/dev/null 2>&1 \
              && docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T cassandra cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1 \
              && curl --fail --silent 'http://localhost:8983/solr/admin/info/system?wt=json' >/dev/null \
              && curl --fail --silent http://localhost:8081/json/ >/dev/null \
              && curl --fail --silent http://localhost:8082/overview >/dev/null \
              && curl --fail --silent http://localhost:9000/minio/health/ready >/dev/null \
              && docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; then
              echo "API, Studio, PostgreSQL, Cassandra, Solr, Spark, Flink, Kafka and MinIO are ready."
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "Timed out waiting for full platform readiness."
              docker compose -f compose.yaml -f compose.full.yaml --profile full ps
              docker compose -f compose.yaml -f compose.full.yaml --profile full logs --no-color
              exit 1
            fi
            sleep 10
          done
      - name: Verify authenticated Iceberg catalog, object storage writes, table reads and snapshots
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_ID="00000000-0000-4000-8000-000000000017"
          docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T postgres \
            psql -U sbase -d sbase -v ON_ERROR_STOP=1 \
            -c "INSERT INTO workspace(id,name) VALUES ('$WORKSPACE_ID','Lakehouse CI workspace') ON CONFLICT (id) DO NOTHING"
          JWT="$(python3 - <<'PY'
          import base64, hashlib, hmac, json, time
          secret=b'dev-only-sbase-jwt-secret-change-me-please'
          enc=lambda value: base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          header=enc(json.dumps({'alg':'HS256','typ':'JWT'},separators=(',',':')).encode())
          payload=enc(json.dumps({'sub':'ci-runner','workspace_id':'00000000-0000-4000-8000-000000000017','groups':['ci'],'iat':int(time.time()),'exp':int(time.time())+900},separators=(',',':')).encode())
          signature=enc(hmac.new(secret,(header+'.'+payload).encode(),hashlib.sha256).digest())
          print(header+'.'+payload+'.'+signature)
          PY
          )"
          AUTH=(-H "Authorization: Bearer $JWT")
          UNAUTH_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/lakehouse/namespaces)"
          test "$UNAUTH_STATUS" = "401"
          curl --fail --silent -X POST http://localhost:8080/api/v1/lakehouse/namespaces \
            "${AUTH[@]}" -H 'Content-Type: application/json' -d '{"namespace":"ci_lakehouse"}'
          curl --fail --silent -X POST http://localhost:8080/api/v1/lakehouse/namespaces/ci_lakehouse/tables/orders/write \
            "${AUTH[@]}" -H 'Content-Type: application/json' \
            -d '{"rows":[{"order_id":1,"region":"EU","amount":120.5},{"order_id":2,"region":"US","amount":80.0}]}'
          curl --fail --silent 'http://localhost:8080/api/v1/lakehouse/namespaces/ci_lakehouse/tables/orders?limit=10' \
            "${AUTH[@]}" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["rowCount"] == 2 and d["format"] == "iceberg"'
          curl --fail --silent http://localhost:8080/api/v1/lakehouse/namespaces/ci_lakehouse/tables/orders/snapshots \
            "${AUTH[@]}" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d) >= 1, "Iceberg snapshot was not committed"'

          # Exercise the real Kafka -> Flink SQL -> Iceberg -> MinIO path.
          docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic sbase-ci-orders --partitions 3 --replication-factor 1
          docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T flink-jobmanager sh -c "cat > /tmp/sbase-kafka-iceberg.sql <<'EOF'
          SET execution.checkpointing.interval = 10s;
          SET execution.checkpointing.mode = EXACTLY_ONCE;
          CREATE CATALOG sbase_iceberg WITH (
            'type'='iceberg',
            'catalog-type'='jdbc',
            'uri'='jdbc:postgresql://postgres:5432/sbase',
            'jdbc.user'='sbase',
            'jdbc.password'='sbase-test',
            'warehouse'='s3://sbase-warehouse/',
            'io-impl'='org.apache.iceberg.aws.s3.S3FileIO',
            'client.region'='us-east-1',
            's3.endpoint'='http://minio:9000',
            's3.access-key-id'='minioadmin',
            's3.secret-access-key'='minioadmin',
            's3.path-style-access'='true'
          );
          CREATE TABLE kafka_ci_orders (
            order_id BIGINT,
            region STRING,
            amount DOUBLE
          ) WITH (
            'connector'='kafka',
            'topic'='sbase-ci-orders',
            'properties.bootstrap.servers'='kafka:9092',
            'properties.group.id'='sbase-ci-flink-iceberg',
            'scan.startup.mode'='earliest-offset',
            'format'='json'
          );
          INSERT INTO sbase_iceberg.ci_lakehouse.orders
          SELECT order_id, region, amount FROM kafka_ci_orders;
          EOF
          nohup /opt/flink/bin/sql-client.sh -f /tmp/sbase-kafka-iceberg.sql >/tmp/sbase-kafka-iceberg.log 2>&1 </dev/null &"
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8082/jobs/overview | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(j.get("state") == "RUNNING" for j in d.get("jobs", []))' 2>/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T flink-jobmanager cat /tmp/sbase-kafka-iceberg.log
              exit 1
            fi
            sleep 2
          done
          printf '%s\\n' \
            '{"order_id":900001,"region":"EU","amount":41.25}' \
            '{"order_id":900002,"region":"APAC","amount":99.5}' | \
            docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T kafka \
              /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:9092 --topic sbase-ci-orders
          for attempt in {1..60}; do
            COUNT="$(curl --fail --silent "http://localhost:8080/api/v1/lakehouse/namespaces/ci_lakehouse/tables/orders?limit=100" \
              "${AUTH[@]}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("rowCount",0))')"
            if [ "$COUNT" -ge 4 ]; then
              echo "Kafka -> Flink -> Iceberg -> MinIO committed records; visible row count: $COUNT"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T flink-jobmanager cat /tmp/sbase-kafka-iceberg.log
              exit 1
            fi
            sleep 5
          done
      - name: Verify Spark worker registration and Flink TaskManager
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8081/json/ | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d.get("workers", [])) >= 1, "Spark has no registered workers"'
          curl --fail --silent http://localhost:8082/taskmanagers | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d.get("taskmanagers", [])) >= 1, "Flink has no registered TaskManagers"'
          for service in flink-jobmanager flink-taskmanager; do
            docker compose -f compose.yaml -f compose.full.yaml --profile full exec -T "$service" sh -ec '
              test -n "$(find /opt/flink/lib -maxdepth 1 -name "flink-sql-connector-kafka-*.jar" -print -quit)"
              test -n "$(find /opt/flink/lib -maxdepth 1 -name "iceberg-flink-runtime-1.20-*.jar" -print -quit)"
              test -n "$(find /opt/flink/plugins/s3-fs-hadoop -maxdepth 1 -name "flink-s3-fs-hadoop-*.jar" -print -quit)"
            '
          done
      - name: Show full platform logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.full.yaml --profile full logs --no-color
      - name: Stop full platform
        if: always()
        run: docker compose -f compose.yaml -f compose.full.yaml --profile full down -v
