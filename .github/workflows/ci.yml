name: CI

on:
  push:
    branches: [main, develop, feature/catalog-federation-automl-api]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sbase
          POSTGRES_USER: sbase
          POSTGRES_PASSWORD: sbase-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbase -d sbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SBASE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/sbase
      SBASE_TEST_POSTGRES_USER: sbase
      SBASE_TEST_POSTGRES_PASSWORD: sbase-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile, unit test, PostgreSQL integration test and package
        run: gradle --no-daemon clean test installDist shadowJar

  workflow-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React Workflow Studio
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, workflow-studio]
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete Compose configuration
        run: docker compose -f compose.yaml -f compose.full.yaml --profile full config --quiet
      - name: Start core platform with Docker Compose
        run: docker compose up --build -d
      - name: Smoke test API, Studio and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null \
              && curl --fail --silent http://localhost:3000/ >/dev/null \
              && docker compose exec -T postgres pg_isready -U sbase -d sbase; then
              echo "SBase API, Workflow Studio and PostgreSQL are ready."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
