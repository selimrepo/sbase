name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Test and package
        run: gradle --no-daemon clean test bootJar

  docker-compose:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version
          docker compose -f docker-compose.yml config --quiet

      - name: Build and start complete stack
        env:
          POSTGRES_PASSWORD: ci-sbase-password
          DORIS_USERNAME: root
          DORIS_PASSWORD: ""
        run: docker compose -f docker-compose.yml up --build -d

      - name: Wait for application liveness
        run: |
          set -eu
          max_attempts=36
          for attempt in $(seq 1 "$max_attempts"); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 4 \
              http://localhost:8080/actuator/health/liveness; then
              echo
              echo "SBase application liveness check passed."
              exit 0
            fi
            echo "Waiting for SBase startup ($attempt/$max_attempts)..."
            if [ "$((attempt % 6))" -eq 0 ]; then
              docker compose -f docker-compose.yml ps
              docker compose -f docker-compose.yml logs --no-color --tail=40 sbase
            fi
            sleep 5
          done
          echo "SBase did not become live within 3 minutes."
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=200
          exit 1

      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.yml ps

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=300

      - name: Stop stack and remove volumes
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans
