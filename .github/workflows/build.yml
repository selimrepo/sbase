name: build

concurrency:
  group: sbase-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build React workspace
        run: |
          npm install --no-audit --no-fund --prefix frontend
          npm run build --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Audit production and environment configuration
        run: bash scripts/production-readiness/config-audit.sh
      - name: Test and package
        run: gradle --no-daemon clean test bootJar

  docker-compose:
    name: PostgreSQL and Spark integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: ci-sbase-password
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose profiles
        env:
          JWT_ISSUER_URI: https://identity.example.test/realms/sbase
          JWT_JWK_SET_URI: https://identity.example.test/realms/sbase/protocol/openid-connect/certs
          SBASE_IMAGE: ghcr.io/selimrepo/sbase:ci-test
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
        run: |
          docker version
          docker compose version
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.development.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          docker compose --profile app-ha config --quiet
          docker compose --profile app-ha --profile observability config --quiet
          docker compose --profile object-storage config --quiet
          docker compose --profile kafka config --quiet
      - name: Build and start PostgreSQL and Spark stack
        run: docker compose --profile app-ha up --build -d
      - name: Wait for both application nodes
        run: |
          set -eu
          for port in 8080 8082; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --connect-timeout 1 --max-time 3 "http://localhost:${port}/actuator/health/liveness"; then
                echo
                ready=true
                break
              fi
              sleep 5
            done
            if [ "$ready" != true ]; then
              docker compose --profile app-ha ps
              docker compose --profile app-ha logs --no-color --tail=250
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Verify Spark PostgreSQL writes, idempotency and tenant isolation
        run: |
          gradle --no-daemon test \
            --tests '*SparkPostgresResilienceTest' \
            --tests '*TenantDataIsolationIntegrationTest' \
            --tests '*PipelineLeaseCoordinatorIntegrationTest'
      - name: Verify PostgreSQL outage and recovery
        run: |
          set -eu
          docker compose stop postgres
          sleep 5
          curl --fail --silent --show-error --connect-timeout 2 --max-time 4 http://localhost:8080/actuator/health/liveness
          docker compose start postgres
          for attempt in $(seq 1 36); do
            if docker inspect --format '{{.State.Health.Status}}' sbase-postgres 2>/dev/null | grep -q healthy; then
              break
            fi
            sleep 5
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' sbase-postgres 2>/dev/null || true)" != "healthy" ]; then
            docker compose --profile app-ha logs --no-color --tail=250 postgres sbase
            exit 1
          fi
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 4 http://localhost:8080/actuator/health/readiness; then
              echo
              exit 0
            fi
            sleep 5
          done
          docker compose --profile app-ha logs --no-color --tail=250 sbase
          exit 1
      - name: Verify application node restart
        run: |
          set -eu
          docker compose --profile app-ha stop sbase-node-2
          curl --fail --silent --show-error --connect-timeout 2 --max-time 4 http://localhost:8080/actuator/health/liveness
          docker compose --profile app-ha start sbase-node-2
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 3 http://localhost:8082/actuator/health/liveness; then
              echo
              exit 0
            fi
            sleep 5
          done
          docker compose --profile app-ha logs --no-color --tail=250 sbase-node-2
          exit 1
      - name: Show container status
        if: always()
        run: docker compose --profile app-ha ps
      - name: Collect logs on failure
        if: failure()
        run: docker compose --profile app-ha logs --no-color --tail=300
      - name: Stop stack and remove ephemeral CI volumes
        if: always()
        run: docker compose --profile app-ha down --volumes --remove-orphans
