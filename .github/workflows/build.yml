name: build
on:
  push:
    branches: [main, feature/pipeline-execution-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build React workspace
        run: |
          npm install --no-audit --no-fund --prefix frontend
          npm run build --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Test and package
        run: gradle --no-daemon clean test bootJar

  docker-compose:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version
          docker compose -f docker-compose.yml config --quiet
      - name: Configure host kernel for Doris BE
        run: |
          sudo sysctl -w vm.max_map_count=2000000
          sudo swapoff -a
          if [ "$(awk 'NR > 1 { total += $3 } END { print total + 0 }' /proc/swaps)" -ne 0 ]; then
            echo "Swap is still enabled; Doris BE requires swap to be disabled."
            cat /proc/swaps
            exit 1
          fi
      - name: Build and start complete stack
        env:
          POSTGRES_PASSWORD: ci-sbase-password
          DORIS_USERNAME: root
          DORIS_PASSWORD: ""
        run: docker compose -f docker-compose.yml up --build -d
      - name: Wait for application liveness
        run: |
          set -eu
          max_attempts=48
          for attempt in $(seq 1 "$max_attempts"); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://localhost:8080/actuator/health/liveness; then
              echo
              echo "SBase application liveness check passed."
              exit 0
            fi
            echo "Waiting for SBase startup ($attempt/$max_attempts)..."
            if [ "$((attempt % 6))" -eq 0 ]; then
              docker compose -f docker-compose.yml ps
              docker compose -f docker-compose.yml logs --no-color --tail=40 sbase
            fi
            sleep 5
          done
          echo "SBase did not become live within 6 minutes."
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=200
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile integration tests before fault injection
        run: gradle --no-daemon testClasses
      - name: Exercise Doris SQL endpoint outage and recovery
        run: |
          set -eu
          # Doris FE owns the MySQL protocol endpoint on port 9030. Stopping only
          # the BE leaves FE accepting JDBC connections, so it cannot satisfy a
          # connection-refused assertion.
          docker compose -f docker-compose.yml stop doris-fe
          curl --fail --silent --show-error --connect-timeout 2 --max-time 4 http://localhost:8080/actuator/health/liveness
          SBASE_DORIS_TEST_JDBC_URL='jdbc:mysql://127.0.0.1:9030/analytics?useSSL=false&allowPublicKeyRetrieval=true' \
          SBASE_DORIS_TEST_USERNAME=root SBASE_DORIS_TEST_PASSWORD='' \
            gradle --no-daemon test --tests '*SparkDorisResilienceTest.jdbcEndpointIsUnavailableDuringDorisFrontendOutage'
          echo "Doris SQL endpoint outage was detected while SBase remained live."
          docker compose -f docker-compose.yml start doris-fe
          for attempt in $(seq 1 36); do
            state="$(docker inspect --format '{{.State.Health.Status}}' sbase-doris-fe 2>/dev/null || true)"
            if [ "$state" = "healthy" ]; then
              echo "Doris frontend SQL endpoint recovered."
              break
            fi
            sleep 5
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' sbase-doris-fe 2>/dev/null || true)" != "healthy" ]; then
            docker compose -f docker-compose.yml logs --no-color --tail=200 doris-fe doris-be
            exit 1
          fi
          # Wait for the BE to re-register with the recovered FE before the load test.
          docker compose -f docker-compose.yml run --rm --no-deps doris-init
      - name: Run real Spark-Doris load and idempotency test
        env:
          SBASE_DORIS_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:9030/analytics?useSSL=false&allowPublicKeyRetrieval=true
          SBASE_DORIS_TEST_USERNAME: root
          SBASE_DORIS_TEST_PASSWORD: ""
        run: gradle --no-daemon test --tests '*SparkDorisResilienceTest'
      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.yml ps
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=300
      - name: Stop stack and remove volumes
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans
